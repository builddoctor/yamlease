name: Validation CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels runs that are out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.1 is the oldest version the gemspec allows; the rest are maintained releases.
        # Quoted so YAML doesn't read 4.0 as the number 4.
        ruby: ['3.1', '3.3', '3.4', '4.0']

    runs-on: ${{ matrix.os }}

    # The tests don't need RuboCop, and its dependencies need a newer Ruby than
    # the gem supports, so leave the development group out.
    env:
      BUNDLE_WITHOUT: development

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Ruby ${{ matrix.ruby }}
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    # Bash on both OSes (Git Bash on Windows): it stops at the first failing
    # command, whereas a multi-line pwsh step only checks the last one.
    - name: Run specs and convert the sample definition
      shell: bash
      run: |
        bundle exec rspec spec
        ruby bin/ye spec/fixtures/show.yml

    # Checks the packaged gem works on its own, outside Bundler and the repo.
    - name: Build, install and run the gem
      if: runner.os == 'Linux'
      run: |
        gem build yamlease.gemspec -o yamlease.gem
        gem install --local --no-document yamlease.gem
        cd "$RUNNER_TEMP" && ye "$GITHUB_WORKSPACE/spec/fixtures/show.yml" > /dev/null
