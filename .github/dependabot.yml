version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release, in case it turns out to be compromised.
    cooldown:
      default-days: 7

  # Keeps the action versions in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release, in case it turns out to be compromised.
    cooldown:
      default-days: 7
